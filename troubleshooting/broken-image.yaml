# Demo bug 1: image tag that does not exist.
# kubectl apply -f troubleshooting/broken-image.yaml
# Watch: kubectl get pods -n appoint  -> ImagePullBackOff
# Fix: kubectl rollout undo deployment/appoint-backend -n appoint
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appoint-backend
  namespace: appoint
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appoint-backend
  template:
    metadata:
      labels:
        app: appoint-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/musharraf1128/hey-appoint-backend:does-not-exist
          ports:
            - containerPort: 8000
