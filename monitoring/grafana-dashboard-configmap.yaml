apiVersion: v1
kind: ConfigMap
metadata:
  name: heyappoint-api-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  heyappoint-api.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "title": "HTTP request rate",
          "targets": [
            {"expr": "sum(rate(http_requests_total{job=~\".*appoint.*\"}[5m]))", "legendFormat": "requests / second", "refId": "A"}
          ],
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "title": "p95 HTTP latency",
          "targets": [
            {"expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=~\".*appoint.*\"}[5m])) by (le))", "legendFormat": "p95", "refId": "A"}
          ],
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "tags": ["heyappoint", "api"],
      "time": {"from": "now-1h", "to": "now"},
      "title": "HeyAppoint API",
      "uid": "heyappoint-api",
      "version": 1
    }
