apiVersion: apps/v1
kind: Deployment
metadata:
  name: appoint-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: appoint-frontend
  template:
    metadata:
      labels:
        app: appoint-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          ports:
            - containerPort: {{ .Values.frontend.port }}
