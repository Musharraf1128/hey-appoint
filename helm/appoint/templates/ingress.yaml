apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appoint-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: appoint-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: appoint-frontend
                port:
                  number: 80
